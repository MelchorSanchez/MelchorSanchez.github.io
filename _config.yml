name: "Melchor Sanchez-Martinez"
title: "Melchor Sanchez-Martinez, PhD"
tagline: "The personal webblog of Melchor Sanchez-Martinez, PhD"
description: "The Personal Homepage for Melchor Sanchez-Martinez. A computational scientist with 15+ years of experience in cheminformatics, AI/ML and data science applied to drug and molecule discovery, with a background in project and science management, passionate about science writing, communication and dissemination."
url: "http://msanchezmartinez.com"
logo: 'avatar.png'

twitter:
  username: melsanm
  card: summary

plugins: [jekyll-paginate, jekyll-seo-tag, jekyll-sitemap]
paginate: 5
paginate_path: "blog/page:num"

permalink: pretty
highlighter: rouge
markdown: kramdown
kramdown:
  parse_block_html: true

exclude:
        - .sass-cache/
        - .jekyll-cache/
        - gemfiles/
        - Gemfile
        - Gemfile.lock
        - node_modules/
        - vendor/bundle/
        - vendor/cache/
        - vendor/gems/
        - vendor/ruby/

collections:
        bio:
                output: true
        publications:
                output: true

